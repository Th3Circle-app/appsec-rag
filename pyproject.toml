[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-rag"
version = "0.1.0"
description = "A small, honest RAG assistant for application security: heading-aware chunking, local sentence-transformer embeddings, a ChromaDB vector store, and grounded, cited answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harrison C. Songolo" }]
keywords = ["rag", "retrieval-augmented-generation", "embeddings", "vector-database", "chromadb", "llm", "appsec", "ai"]
dependencies = ["chromadb>=0.5"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
appsec-rag = "appsec_rag.cli:main"

[tool.setuptools]
packages = ["appsec_rag"]
